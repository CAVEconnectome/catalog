name: publish release

on:
    workflow_dispatch:
        inputs:
            part:
                description: "Semver part to bump (major, minor, patch)"
                type: choice
                required: true
                default: "patch"
                options: ["major", "minor", "patch"]
            dry-run:
                description: "Dry run"
                type: boolean
                required: true
                default: false
    workflow_call:
        inputs:
            part:
                description: "Semver part to bump (major, minor, patch)"
                type: string
                required: false
                default: "patch"
            dry-run:
                description: "Dry run"
                type: boolean
                required: false
                default: false

jobs:
    bump:
        name: Bump version
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        outputs:
            VERSION: ${{ steps.get-version.outputs.VERSION }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # A short-lived installation token for the cave-helm-chart-updater GitHub App,
            # limited to cave-helm-charts. The app's settings page has no usable token: it
            # signs with its private key and exchanges that for this token on every run.
            - name: Get cave-helm-charts token
              id: helm-charts-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.HELM_CHART_APP_ID }}
                  private-key: ${{ secrets.HELM_CHART_APP_PRIVATE_KEY }}
                  owner: CAVEconnectome
                  repositories: cave-helm-charts

            - name: Checkout cave-helm-charts repo
              uses: actions/checkout@v4
              with:
                  repository: CAVEconnectome/cave-helm-charts
                  token: ${{ steps.helm-charts-token.outputs.token }}
                  path: helm-charts

            - name: Get tags
              run: git fetch --tags origin

            - name: Configure git for github-actions[bot]
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install dependencies
              run: uv sync --frozen --dev

            # The chart and the app share one version number, but the chart can be bumped on
            # its own (a template change). Bump from whichever of the two is ahead, so the new
            # version is past both and the app skips the patch versions the chart already used.
            - name: Determine bump base version
              id: base-version
              run: |
                  code_version="$(sed -nE 's/^current_version[[:space:]]*=[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' pyproject.toml)"
                  chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' helm-charts/charts/catalog/Chart.yaml | head -n 1)"
                  code_base_version="${code_version%%-*}"
                  chart_base_version="${chart_version%%-*}"

                  if [[ ! "$code_base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid code version: $code_version" >&2
                    exit 1
                  fi
                  if [[ ! "$chart_base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid chart version: $chart_version" >&2
                    exit 1
                  fi

                  base_version="$(printf '%s\n' "$code_base_version" "$chart_base_version" | sort -V | tail -n 1)"
                  echo "Code version: $code_version (base: $code_base_version)"
                  echo "Chart version: $chart_version (base: $chart_base_version)"
                  echo "Bump base version: $base_version"
                  echo "CODE_VERSION=$code_version" >> "$GITHUB_OUTPUT"
                  echo "BASE_VERSION=$base_version" >> "$GITHUB_OUTPUT"

            # uv.lock is relocked and committed with each bump by bump-my-version's
            # pre_commit_hooks (pyproject.toml).
            - name: Bump version
              run: |
                  if [[ "${{ steps.base-version.outputs.CODE_VERSION }}" != "${{ steps.base-version.outputs.BASE_VERSION }}" ]]; then
                    uv run --frozen bump-my-version bump \
                      --current-version "${{ steps.base-version.outputs.CODE_VERSION }}" \
                      --new-version "${{ steps.base-version.outputs.BASE_VERSION }}" \
                      --no-tag
                  fi
                  uv run --frozen bump-my-version bump \
                    --current-version "${{ steps.base-version.outputs.BASE_VERSION }}" \
                    ${{ inputs.part }}

            - name: Get version
              id: get-version
              run: |
                  version="$(git describe --tags)"
                  version="${version:1}"
                  echo "VERSION=$version" >> $GITHUB_OUTPUT

            - name: Commit and push with tags
              if: ${{ inputs.dry-run == false }}
              run: |
                  git pull --rebase origin main
                  git push --follow-tags

            - name: Create GitHub Release
              if: ${{ inputs.dry-run == false }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.get-version.outputs.VERSION }}
                  name: Release v${{ steps.get-version.outputs.VERSION }}
                  generate_release_notes: true
                  draft: false
                  prerelease: false

    update-chart:
        name: Update catalog Helm chart
        runs-on: ubuntu-latest
        needs: bump
        if: ${{ inputs.dry-run == false }}
        permissions:
            contents: read
            id-token: write
        steps:
            # See the bump job.
            - name: Get cave-helm-charts token
              id: helm-charts-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.HELM_CHART_APP_ID }}
                  private-key: ${{ secrets.HELM_CHART_APP_PRIVATE_KEY }}
                  owner: CAVEconnectome
                  repositories: cave-helm-charts

            - name: Checkout cave-helm-charts repo
              uses: actions/checkout@v4
              with:
                  repository: CAVEconnectome/cave-helm-charts
                  token: ${{ steps.helm-charts-token.outputs.token }}
                  path: helm-charts

            - name: Update Chart.yaml appVersion
              run: |
                  cd helm-charts
                  chart_file="charts/catalog/Chart.yaml"
                  sed -i "s/^appVersion: .*/appVersion: \"${{ needs.bump.outputs.VERSION }}\"/" $chart_file
                  sed -i "s/^version: .*/version: ${{ needs.bump.outputs.VERSION }}/" $chart_file
                  echo "Updated chart to v${{ needs.bump.outputs.VERSION }}"

            - name: Commit and push changes
              run: |
                  cd helm-charts
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add charts/catalog/Chart.yaml
                  git commit -m "Update catalog to v${{ needs.bump.outputs.VERSION }}

                  - Update appVersion to ${{ needs.bump.outputs.VERSION }}
                  - Update chart version to ${{ needs.bump.outputs.VERSION }}

                  Auto-generated by catalog release workflow"
                  git push
